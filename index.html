<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Speak in Silence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #070a12;
      --card-bg: rgba(15, 22, 36, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.3);
      --indigo: #6366f1;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* GATEWAY LANDING OVERLAY */
    #gate-screen {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      z-index: 10;
    }

    .gate-icon {
      font-size: 2.5rem;
      width: 64px; height: 64px;
      margin: 0 auto;
      background: linear-gradient(135deg, var(--emerald), var(--indigo));
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px var(--emerald-glow);
    }

    .gate-title { font-size: 1.5rem; font-weight: 800; margin: 0; color: #fff; }
    .gate-subtitle { font-size: 0.9rem; color: var(--text-muted); margin-top: -10px; }

    .gate-input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .gate-input-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--emerald);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .gate-input-group input {
      background: rgba(10, 15, 26, 0.9);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      font-family: var(--font-mono);
    }
    .gate-input-group input:focus {
      border-color: var(--emerald);
      box-shadow: 0 0 0 3px var(--emerald-glow);
    }

    /* ANIMATED WARNING BANNER WITH ENTRY POP-IN */
    #gate-error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      text-align: left;
      animation: 
        popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
        pulse-red 2.5s infinite 0.3s ease-in-out;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(-16px) scale(0.92);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 15px 3px rgba(239, 68, 68, 0.2); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
    }

    #suggestions-box {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .suggestion-chip {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: var(--emerald);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .suggestion-chip:hover {
      background: var(--emerald);
      color: #031e13;
      transform: translateY(-1px);
    }

    .enter-btn {
      background: var(--emerald);
      color: #031e13;
      border: none;
      font-weight: 800;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }
    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px var(--emerald-glow);
    }

    /* MAIN APP CONTAINER */
    .container {
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: none;
      flex-direction: column;
    }

    header {
      padding: 20px 28px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 21, 33, 0.6);
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--emerald), var(--indigo));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 0 15px var(--emerald-glow);
    }
    
    .brand h1 { margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
    .room-tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--emerald);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(10, 15, 26, 0.8);
      border: 1px solid var(--card-border);
    }

    .pulse-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }
    .pulse-dot.online {
      background: var(--emerald);
      box-shadow: 0 0 12px var(--emerald);
    }

    .profile-bar {
      padding: 12px 28px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 0.85rem;
    }

    .profile-bar input {
      background: rgba(10, 15, 26, 0.8);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      outline: none;
    }

    #messages {
      height: 380px;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(10, 15, 26, 0.3);
    }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg.me {
      align-self: flex-end;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #031e13;
      font-weight: 600;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px var(--emerald-glow);
    }

    .msg.peer {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    .msg.system {
      align-self: stretch;
      background: rgba(10, 15, 26, 0.8);
      color: #10b981;
      font-size: 0.82rem;
      border-radius: 8px;
      padding: 8px 14px;
      border: 1px solid rgba(16, 185, 129, 0.2);
      font-family: var(--font-mono);
    }

    .sender-tag {
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 4px;
      display: block;
      opacity: 0.8;
    }

    .chat-controls {
      padding: 16px 28px;
      border-top: 1px solid var(--card-border);
      display: flex;
      gap: 12px;
      background: rgba(15, 21, 33, 0.6);
    }

    .chat-controls input[type="text"] {
      flex: 1;
      background: rgba(10, 15, 26, 0.8);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
    }

    .btn {
      background: var(--emerald);
      color: #031e13;
      border: none;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
    }

    .file-panel {
      padding: 20px 28px;
      background: rgba(10, 15, 26, 0.5);
      border-top: 1px solid var(--card-border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .file-card {
      border: 2px dashed rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      position: relative;
      background: rgba(255, 255, 255, 0.02);
    }
    .file-card:hover {
      border-color: var(--emerald);
      background: var(--emerald-glow);
    }

    .file-card input[type="file"] {
      position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer;
    }

    .download-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    code { font-family: var(--font-mono); background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- GATEWAY SCREEN -->
  <div id="gate-screen">
    <div class="gate-icon">🤫</div>
    <h2 class="gate-title">You are about to enter the anonymous chat</h2>
    <p class="gate-subtitle">Zero logs. Ephemeral P2P mesh. Encrypted memory node.</p>

    <div id="gate-error-banner">
      <div id="gate-error-msg">Name taken!</div>
      <div id="suggestions-box"></div>
    </div>

    <div class="gate-input-group">
      <label>Choose your handle</label>
      <input type="text" id="gate-username-input" placeholder="e.g. Batman" autofocus />
    </div>

    <button class="enter-btn" id="enter-room-btn">JOIN ANONYMOUS SWARM →</button>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div class="container" id="main-chat-app">
    <header>
      <div class="brand">
        <div class="brand-icon">🤫</div>
        <div>
          <h1>Speak in Silence</h1>
        </div>
        <span class="room-tag" id="room-display">Chat Room</span>
      </div>
      
      <div class="status-badge">
        <span class="pulse-dot" id="status-dot"></span>
        <span id="connected-count">0 Connected Peers</span>
      </div>
    </header>

    <div class="profile-bar">
      <span>Username:</span>
      <input type="text" id="username-input" />
      <button class="btn" style="padding: 6px 14px; font-size: 0.8rem;" id="update-user-btn">Set Handle</button>
      <span style="margin-left: auto; font-family: var(--font-mono); color: var(--text-muted);" id="my-peer-id">ID: ...</span>
    </div>

    <div id="messages"></div>

    <div class="chat-controls">
      <input type="text" id="msg-input" placeholder="Type a message into the encrypted mesh..." />
      <button class="btn" id="send-btn">Send</button>
    </div>

    <div class="file-panel">
      <div class="file-card">
        <input type="file" id="direct-file-input" />
        <span style="font-weight:700; color: var(--emerald); display:block;">⚡ Direct P2P Stream</span>
        <span style="font-size:0.75rem; color:var(--text-muted);">Streams binary chunks directly over WebRTC</span>
      </div>
      <div class="file-card">
        <input type="file" id="ipfs-file-input" />
        <span style="font-weight:700; color: #a5b4fc; display:block;">📦 Share via IPFS</span>
        <span style="font-size:0.75rem; color:var(--text-muted);">Pins locally & broadcasts content CID</span>
      </div>
    </div>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
